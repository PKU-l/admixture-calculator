<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>混凝土外加剂用量计算器</title>
<style>
  :root{
    --navy:#123a63;        /* 主色 深蓝 */
    --navy-dark:#0d2c4d;
    --navy-light:#1e5288;
    --gray-bg:#eef1f5;     /* 辅助 浅灰 */
    --gray-line:#d4dae2;
    --gray-soft:#f6f8fa;
    --green:#1e874b;       /* 计算/确认 绿 */
    --green-dark:#166b3b;
    --red:#c0392b;         /* 删除/错误 红 */
    --amber:#8a6d00;
    --amber-bg:#fff6da;
    --amber-line:#f0d264;
    --text:#1c2733;
    --muted:#5b6a7a;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--gray-bg);
    color:var(--text);
    font-size:16px;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);
    color:#fff;
    padding:18px 16px;
    text-align:center;
  }
  header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.5px;}
  header p{margin:6px 0 0;font-size:13px;opacity:.9;}
  .wrap{max-width:1200px;margin:0 auto;padding:14px 12px 90px;}

  .card{
    background:var(--white);
    border:1px solid var(--gray-line);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 1px 3px rgba(18,58,99,.06);
  }
  .card h2{
    margin:0 0 12px;
    font-size:17px;
    color:var(--navy);
    display:flex;align-items:center;gap:8px;
  }
  .card h2 .tag{font-size:12px;font-weight:400;color:var(--muted);}

  /* 折叠参数区 */
  .collapse-head{
    cursor:pointer;user-select:none;
    display:flex;justify-content:space-between;align-items:center;
    background:var(--navy);color:#fff;
    padding:12px 16px;border-radius:10px;
    font-size:16px;font-weight:600;
  }
  .collapse-head .arrow{transition:transform .2s;font-size:14px;}
  .collapse-head.open .arrow{transform:rotate(90deg);}
  .collapse-body{display:none;margin-top:10px;}
  .collapse-body.open{display:block;}

  .grid{display:grid;gap:12px;}
  .params-grid{grid-template-columns:1fr;}
  @media(min-width:640px){.params-grid{grid-template-columns:1fr 1fr;}}
  @media(min-width:960px){.params-grid{grid-template-columns:1fr 1fr 1fr;}}

  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:13px;color:var(--muted);font-weight:600;}
  .input-line{position:relative;display:flex;align-items:center;}
  .input-line input{
    width:100%;
    padding:11px 12px;
    font-size:16px;
    border:1.5px solid var(--gray-line);
    border-radius:8px;
    background:#fff;
    color:var(--text);
    min-height:44px;
  }
  .input-line input:focus{outline:none;border-color:var(--navy-light);box-shadow:0 0 0 3px rgba(30,82,136,.15);}
  .input-line input.err{border-color:var(--red);background:#fff5f4;}
  .input-line .unit{
    position:absolute;right:10px;font-size:14px;color:var(--muted);pointer-events:none;
    background:linear-gradient(90deg,rgba(255,255,255,0),#fff 30%);padding-left:8px;
  }
  .input-line.has-apply input{padding-right:44px;}
  .apply-btn{
    position:absolute;right:6px;
    border:none;background:var(--navy-light);color:#fff;
    width:32px;height:32px;border-radius:6px;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .apply-btn:active{background:var(--navy);}
  .err-msg{color:var(--red);font-size:12.5px;min-height:0;display:none;}
  .err-msg.show{display:block;}
  .warn-msg{color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-line);
    font-size:12.5px;padding:4px 8px;border-radius:6px;display:none;margin-top:4px;}
  .warn-msg.show{display:block;}

  /* 配方卡片 */
  .recipe{
    border:1px solid var(--gray-line);
    border-radius:10px;
    padding:14px;
    margin-bottom:12px;
    background:var(--gray-soft);
  }
  .recipe-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .recipe-name{flex:1;}
  .recipe-fields{display:grid;gap:10px;grid-template-columns:1fr;}
  @media(min-width:560px){.recipe-fields{grid-template-columns:1fr 1fr;}}
  @media(min-width:900px){.recipe-fields{grid-template-columns:repeat(4,1fr);}}
  .del-btn{
    border:1.5px solid var(--red);background:#fff;color:var(--red);
    border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;white-space:nowrap;min-height:40px;
  }
  .del-btn:active{background:var(--red);color:#fff;}

  .detail-toggle{
    margin-top:10px;border:none;background:transparent;color:var(--navy-light);
    font-size:14px;cursor:pointer;padding:4px 0;text-decoration:underline;
  }
  .detail-box{
    display:none;margin-top:8px;background:#fff;border:1px dashed var(--gray-line);
    border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text);line-height:1.7;
  }
  .detail-box.show{display:block;}
  .detail-box .mline{font-family:"Consolas","Menlo",monospace;color:var(--navy);}
  .detail-box .grp{margin-bottom:8px;}
  .detail-box .grp b{color:var(--navy);}

  /* 按钮 */
  .btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  button.btn{
    border:none;border-radius:8px;padding:12px 16px;font-size:15px;font-weight:600;
    cursor:pointer;min-height:46px;flex:1 1 auto;
  }
  .btn-calc{background:var(--green);color:#fff;flex:2 1 200px;font-size:17px;}
  .btn-calc:active{background:var(--green-dark);}
  .btn-second{background:#fff;color:var(--navy);border:1.5px solid var(--navy-light);}
  .btn-second:active{background:var(--navy);color:#fff;}
  .btn-add{background:var(--navy-light);color:#fff;}
  .btn-add:active{background:var(--navy);}
  .btn-danger{background:#fff;color:var(--red);border:1.5px solid var(--red);}
  .btn-danger:active{background:var(--red);color:#fff;}

  .dec-switch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .dec-switch span{font-size:13px;color:var(--muted);}
  .dec-switch .seg{display:inline-flex;border:1.5px solid var(--gray-line);border-radius:8px;overflow:hidden;}
  .dec-switch .seg button{
    border:none;background:#fff;color:var(--navy);padding:8px 14px;font-size:14px;cursor:pointer;min-height:40px;
  }
  .dec-switch .seg button.active{background:var(--navy);color:#fff;}

  /* 结果表 */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--gray-line);border-radius:8px;}
  table{border-collapse:collapse;width:100%;min-width:900px;font-size:14px;}
  th,td{border-bottom:1px solid var(--gray-line);padding:10px 10px;text-align:right;white-space:nowrap;}
  th{background:var(--navy);color:#fff;font-weight:600;text-align:center;}
  th.grp-th{background:var(--navy-light);border-left:1px solid rgba(255,255,255,.25);border-right:1px solid rgba(255,255,255,.25);}
  tr.sub-th th{background:var(--navy);font-weight:600;font-size:13px;padding:6px 10px;}
  td:first-child,th:first-child{text-align:left;}
  td{text-align:right;}
  tbody tr:nth-child(even){background:var(--gray-soft);}
  td.strong{font-weight:700;color:var(--navy);}
  .scroll-hint{font-size:12px;color:var(--muted);margin:6px 2px 0;}

  /* 汇总卡片 */
  .summary-grid{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:14px;}
  @media(min-width:760px){.summary-grid{grid-template-columns:repeat(3,1fr);}}
  .sum-card{border-radius:10px;padding:14px;color:#fff;}
  .sum-card .lbl{font-size:13px;opacity:.92;}
  .sum-card .val{font-size:22px;font-weight:700;margin-top:4px;}
  .sum-card .val2{font-size:16px;font-weight:600;margin-top:2px;opacity:.92;}
  .sum-card .u{font-size:14px;font-weight:500;opacity:.9;}
  .sum-blue{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);}
  .sum-green{background:linear-gradient(135deg,var(--green) 0%,#28a862 100%);}
  .sum-total{grid-column:1 / -1;background:linear-gradient(135deg,var(--green-dark) 0%,var(--navy) 100%);}
  .sum-total .val{font-size:28px;}

  .note-line{margin-top:14px;font-size:13px;color:var(--muted);background:var(--gray-soft);
    border-left:4px solid var(--navy-light);padding:10px 12px;border-radius:6px;}

  .disclaimer{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--navy-dark);color:#eaf1f8;font-size:12px;
    padding:8px 14px;text-align:center;line-height:1.4;z-index:50;
    box-shadow:0 -2px 8px rgba(0,0,0,.2);
  }
  .results-empty{color:var(--muted);font-size:14px;text-align:center;padding:16px;}
  .toast{
    position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
    background:var(--navy-dark);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:100;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <h1>混凝土外加剂用量计算器</h1>
  <p>按混凝土方量、基准掺量、比例及材料密度换算</p>
</header>

<div class="wrap">

  <!-- 参数设置（默认折叠） -->
  <div>
    <div class="collapse-head" id="paramHead">
      <span>⚙️ 计算参数设置</span>
      <span class="arrow">▶</span>
    </div>
    <div class="collapse-body" id="paramBody">
      <div class="card" style="margin-top:10px;">
        <h2>基础参数 <span class="tag">现场如无必要请勿修改</span></h2>
        <div class="grid params-grid">
          <div class="field">
            <label>每盘混凝土方量</label>
            <div class="input-line"><input type="number" id="volBatch" step="0.01" inputmode="decimal"><span class="unit">m³</span></div>
            <div class="err-msg" id="err_volBatch"></div>
          </div>
          <div class="field">
            <label>缓凝剂 100%基准掺量</label>
            <div class="input-line"><input type="number" id="retBase" step="0.01" inputmode="decimal"><span class="unit">kg/m³</span></div>
            <div class="err-msg" id="err_retBase"></div>
          </div>
          <div class="field">
            <label>缓凝剂 密度</label>
            <div class="input-line"><input type="number" id="retDens" step="0.01" inputmode="decimal"><span class="unit">kg/L</span></div>
            <div class="err-msg" id="err_retDens"></div>
          </div>
          <div class="field">
            <label>减水剂 100%基准掺量</label>
            <div class="input-line"><input type="number" id="redBase" step="0.01" inputmode="decimal"><span class="unit">kg/m³</span></div>
            <div class="err-msg" id="err_redBase"></div>
          </div>
          <div class="field">
            <label>减水剂 密度</label>
            <div class="input-line"><input type="number" id="redDens" step="0.01" inputmode="decimal"><span class="unit">kg/L</span></div>
            <div class="err-msg" id="err_redDens"></div>
          </div>
          <div class="field">
            <label>防水剂 100%基准掺量</label>
            <div class="input-line"><input type="number" id="wpBase" step="0.01" inputmode="decimal"><span class="unit">kg/m³</span></div>
            <div class="err-msg" id="err_wpBase"></div>
          </div>
          <div class="field">
            <label>防水剂 密度</label>
            <div class="input-line"><input type="number" id="wpDens" step="0.01" inputmode="decimal"><span class="unit">kg/L</span></div>
            <div class="err-msg" id="err_wpDens"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 配方输入 -->
  <div class="card">
    <h2>配方输入 <span class="tag">缓凝剂 / 减水剂 / 防水剂 比例</span></h2>
    <div id="recipeList"></div>
    <div class="btn-row">
      <button class="btn btn-add" id="addBtn">＋ 添加配方</button>
    </div>
  </div>

  <!-- 操作按钮 -->
  <div class="card">
    <div class="dec-switch">
      <span>结果小数位：</span>
      <div class="seg" id="decSeg">
        <button data-d="1">1 位</button>
        <button data-d="2">2 位</button>
        <button data-d="3">3 位</button>
      </div>
    </div>
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn btn-calc" id="calcBtn">▶ 开始计算</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-second" id="copyBtn">📋 复制结果</button>
      <button class="btn btn-second" id="printBtn">🖨 打印计算单</button>
      <button class="btn btn-second" id="csvBtn">⬇ 导出CSV</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-second" id="resetBtn">↺ 恢复默认参数</button>
      <button class="btn btn-danger" id="clearBtn">🗑 清空全部配方</button>
    </div>
  </div>

  <!-- 计算结果 -->
  <div class="card">
    <h2>计算结果</h2>
    <div id="resultArea">
      <div class="results-empty">点击「开始计算」后在此显示结果表与汇总。</div>
    </div>
  </div>

  <div class="note-line">
    提示：现场投料前应核对外加剂产品密度、配合比通知单及试验室确认数据。
  </div>
</div>

<div class="disclaimer">
  本工具仅用于用量换算，最终投料量应以经批准的混凝土配合比、试验室通知及外加剂产品技术资料为准。
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =====================================================================
   混凝土外加剂用量计算器  —  纯前端，离线可用
   -----------------------------------------------------------------
   计算口径说明（与题目校验数据一致）：
   1) 质量、单盘体积均以完整精度计算，不对中间质量做提前取整；
   2) 单盘体积按所选小数位「标准四舍五入」一次，得到显示用「单盘用量」；
   3) 所有合计（单盘合计 / 配方总量 / 分类合计 / 总计）均以该
      「已舍入的单盘用量」为累加单元，保证屏幕上的数字彼此相加对得上，
      并精确复现校验值（如减水剂三盘合计 = 1.527×3 = 4.581 L）。
   ===================================================================== */

var LS_KEY = "concrete_admixture_calc_v1";

var DEFAULT_PARAMS = {
  volBatch:0.5,
  retBase:1.00, retDens:1.20,
  redBase:4.80, redDens:1.10,
  wpBase:4.80,  wpDens:1.00
};
var PARAM_IDS = ["volBatch","retBase","retDens","redBase","redDens","wpBase","wpDens"];

function defaultRecipes(){
  return [
    {name:"配方1", batches:1, ret:175, red:70, wp:70},
    {name:"配方2", batches:1, ret:185, red:70, wp:70},
    {name:"配方3", batches:1, ret:195, red:70, wp:70}
  ];
}

var state = {
  recipes: defaultRecipes(),
  decimals: 3
};

/* ---------- 工具函数 ---------- */
// 标准四舍五入到 d 位小数（含极小 epsilon 修正浮点误差）
function roundTo(x, d){
  if(!isFinite(x)) return x;
  var f = Math.pow(10, d);
  var v = x * f;
  // epsilon 修正：如 2312.4999999 -> 2312.5
  v = v + (v >= 0 ? 1e-9 : -1e-9);
  return Math.round(v) / f;
}
function fmt(x, d){ return roundTo(x, d).toFixed(d); }
// 去掉末尾多余 0（用于计算过程展示的质量）
function trim(x){
  var s = (Math.round(x*1e6)/1e6).toString();
  return s;
}
function $(id){ return document.getElementById(id); }
function showToast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

/* ---------- localStorage ---------- */
function saveState(){
  readParamsToObj(); // 确保参数最新
  var data = {
    params: currentParams(),
    recipes: state.recipes,
    decimals: state.decimals
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
}
function loadState(){
  var raw = null;
  try{ raw = localStorage.getItem(LS_KEY); }catch(e){}
  if(!raw){ applyParams(DEFAULT_PARAMS); return; }
  try{
    var data = JSON.parse(raw);
    applyParams(Object.assign({}, DEFAULT_PARAMS, data.params||{}));
    if(Array.isArray(data.recipes) && data.recipes.length){
      state.recipes = data.recipes.map(function(r){
        return {
          name: (r.name!=null?String(r.name):""),
          batches: (r.batches!=null?r.batches:1),
          ret: (r.ret!=null?r.ret:0),
          red: (r.red!=null?r.red:70),
          wp:  (r.wp!=null?r.wp:70)
        };
      });
    }
    if([1,2,3].indexOf(data.decimals)>=0) state.decimals = data.decimals;
  }catch(e){ applyParams(DEFAULT_PARAMS); }
}

/* ---------- 参数读写 ---------- */
function applyParams(p){
  PARAM_IDS.forEach(function(id){ $(id).value = p[id]; });
}
function currentParams(){
  var o = {};
  PARAM_IDS.forEach(function(id){ o[id] = parseFloat($(id).value); });
  return o;
}
function readParamsToObj(){ /* 占位，参数直接从 DOM 读取 */ }

/* ---------- 配方渲染 ---------- */
function syncRecipesFromDOM(){
  // 将当前 DOM 中的输入回写到 state.recipes（避免重渲染丢失未保存输入）
  var cards = document.querySelectorAll(".recipe");
  cards.forEach(function(card, i){
    if(!state.recipes[i]) return;
    var r = state.recipes[i];
    r.name    = card.querySelector(".r-name").value;
    r.batches = card.querySelector(".r-batches").value;
    r.ret     = card.querySelector(".r-ret").value;
    r.red     = card.querySelector(".r-red").value;
    r.wp      = card.querySelector(".r-wp").value;
  });
}

function renderRecipes(){
  var list = $("recipeList");
  list.innerHTML = "";
  state.recipes.forEach(function(r, idx){
    var card = document.createElement("div");
    card.className = "recipe";
    card.innerHTML =
      '<div class="recipe-top">'+
        '<div class="field recipe-name">'+
          '<label>配方名称</label>'+
          '<div class="input-line"><input type="text" class="r-name" value="'+escapeAttr(r.name)+'"></div>'+
        '</div>'+
        '<button class="del-btn" data-act="del" data-i="'+idx+'">删除</button>'+
      '</div>'+
      '<div class="recipe-fields">'+
        field("该配方盘数","r-batches",r.batches,"盘","del-apply",false,idx,"batches")+
        field("缓凝剂比例","r-ret",r.ret,"%","apply",true,idx,"ret")+
        field("减水剂比例","r-red",r.red,"%","apply",true,idx,"red")+
        field("防水剂比例","r-wp",r.wp,"%","apply",true,idx,"wp")+
      '</div>'+
      '<div class="warn-msg" data-warn="'+idx+'"></div>'+
      '<div class="err-msg" data-rerr="'+idx+'"></div>'+
      '<button class="detail-toggle" data-act="detail" data-i="'+idx+'">▸ 查看计算过程</button>'+
      '<div class="detail-box" data-detail="'+idx+'"></div>';
    list.appendChild(card);
  });
  bindRecipeEvents();
}

function field(label, cls, val, unit, applyMode, showApply, idx, key){
  var applyBtn = showApply ? '<button class="apply-btn" title="应用到全部配方" data-act="applyall" data-i="'+idx+'" data-key="'+key+'">⇊</button>' : '';
  var hasApply = showApply ? ' has-apply' : '';
  var inputType = (cls==="r-batches") ? 'inputmode="numeric" step="1"' : 'inputmode="decimal" step="0.01"';
  return ''+
    '<div class="field">'+
      '<label>'+label+'</label>'+
      '<div class="input-line'+hasApply+'">'+
        '<input type="number" class="'+cls+'" '+inputType+' value="'+escapeAttr(val)+'">'+
        applyBtn+
        '<span class="unit"'+(showApply?' style="right:44px;"':'')+'>'+unit+'</span>'+
      '</div>'+
    '</div>';
}

function escapeAttr(s){
  return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function bindRecipeEvents(){
  document.querySelectorAll('[data-act="del"]').forEach(function(b){
    b.onclick = function(){
      syncRecipesFromDOM();
      var i = +b.getAttribute("data-i");
      state.recipes.splice(i,1);
      if(state.recipes.length===0) state.recipes.push({name:"配方1",batches:1,ret:0,red:70,wp:70});
      renderRecipes(); saveState();
    };
  });
  document.querySelectorAll('[data-act="detail"]').forEach(function(b){
    b.onclick = function(){

/* ---------- 校验 ---------- */
function clearErrors(){
  document.querySelectorAll(".err-msg").forEach(function(e){ e.classList.remove("show"); e.textContent=""; });
  document.querySelectorAll(".warn-msg").forEach(function(e){ e.classList.remove("show"); e.textContent=""; });
  document.querySelectorAll("input.err").forEach(function(e){ e.classList.remove("err"); });
}
function setErr(inputEl, msgEl, msg){
  if(inputEl) inputEl.classList.add("err");
  if(msgEl){ msgEl.textContent = msg; msgEl.classList.add("show"); }
}

function validate(){
  clearErrors();
  var ok = true;
  var p = currentParams();

  function chkParam(id, cond, msg){
    if(!cond){ setErr($(id), $("err_"+id), msg); ok=false; }
  }
  chkParam("volBatch", isFinite(p.volBatch) && p.volBatch>0, "每盘方量必须大于 0");
  chkParam("retBase",  isFinite(p.retBase)  && p.retBase>=0,  "基准掺量不能为负数");
  chkParam("redBase",  isFinite(p.redBase)  && p.redBase>=0,  "基准掺量不能为负数");
  chkParam("wpBase",   isFinite(p.wpBase)   && p.wpBase>=0,   "基准掺量不能为负数");
  chkParam("retDens",  isFinite(p.retDens)  && p.retDens>0,   "密度必须大于 0");
  chkParam("redDens",  isFinite(p.redDens)  && p.redDens>0,   "密度必须大于 0");
  chkParam("wpDens",   isFinite(p.wpDens)   && p.wpDens>0,    "密度必须大于 0");
  if(!ok){ openParams(); }

  var cards = document.querySelectorAll(".recipe");
  cards.forEach(function(card, i){
    var r = state.recipes[i];
    var errEl = card.querySelector('[data-rerr="'+i+'"]');
    var warnEl = card.querySelector('[data-warn="'+i+'"]');
    var msgs = [];

    var batches = Number(r.batches);
    if(!(isFinite(batches) && batches>0 && Math.floor(batches)===batches)){
      card.querySelector(".r-batches").classList.add("err");
      msgs.push("盘数必须为大于 0 的整数");
    }
    [["ret",".r-ret","缓凝剂"],["red",".r-red","减水剂"],["wp",".r-wp","防水剂"]].forEach(function(m){
      var val = Number(r[m[0]]);
      if(!(isFinite(val) && val>=0)){
        card.querySelector(m[1]).classList.add("err");
        msgs.push(m[2]+"比例不能为空且不能为负数");
      }
    });
    if(msgs.length){ errEl.textContent = msgs.join("；"); errEl.classList.add("show"); ok=false; }

    // 黄色高比例提醒（允许继续计算）
    var highs = [];
    [["ret","缓凝剂"],["red","减水剂"],["wp","防水剂"]].forEach(function(m){
      var val = Number(r[m[0]]);
      if(isFinite(val) && val>200) highs.push(m[1]);
    });
    if(highs.length){
      warnEl.textContent = "当前比例较高（"+highs.join("、")+"），请核对配合比或试验要求";
      warnEl.classList.add("show");
    }
  });
  return ok;
}

/* ---------- 核心计算 ---------- */
function computeAll(){
  var p = currentParams();
  var d = state.decimals;
  var mats = [
    {key:"ret", label:"缓凝剂", base:p.retBase, dens:p.retDens},
    {key:"red", label:"减水剂", base:p.redBase, dens:p.redDens},
    {key:"wp",  label:"防水剂", base:p.wpBase,  dens:p.wpDens}
  ];
  var rows = [];
  var catTotal = {ret:0, red:0, wp:0};   // 分类体积合计(L)
  var catMass  = {ret:0, red:0, wp:0};   // 分类质量合计(kg)
  var totalBatches = 0;
  var totalVolume = 0;

  state.recipes.forEach(function(r){
    var batches = Number(r.batches);
    totalBatches += batches;
    totalVolume += p.volBatch * batches;

    var perBatch = {}; // 已按小数位舍入的单盘体积(L)（累加单元）
    var perMass  = {}; // 已按小数位舍入的单盘质量(kg)（累加单元）
    var perBatchSum = 0, perMassSum = 0;
    mats.forEach(function(m){
      var ratio = Number(r[m.key]);
      var mass = p.volBatch * m.base * ratio / 100;      // 完整精度 质量
      var volFull = mass / m.dens;                        // 完整精度 体积
      var massR = roundTo(mass, d);                       // 舍入一次
      var volR = roundTo(volFull, d);                     // 舍入一次
      perMass[m.key] = massR;
      perBatch[m.key] = volR;
      perMassSum += massR;
      perBatchSum += volR;
      catMass[m.key]  += massR * batches;                 // 分类合计以舍入单盘值累加
      catTotal[m.key] += volR * batches;
    });
    var recipeTotal = perBatchSum * batches;              // 该配方按盘数总量(L)
    var recipeMassTotal = perMassSum * batches;           // 该配方按盘数总量(kg)
    rows.push({
      name:r.name, batches:batches, vol:p.volBatch,
      per:perBatch, mass:perMass, perSum:perBatchSum, massSum:perMassSum,
      recipeTotal:recipeTotal, recipeMassTotal:recipeMassTotal
    });
  });

  var grand = catTotal.ret + catTotal.red + catTotal.wp;      // 总体积(L)
  var grandMass = catMass.ret + catMass.red + catMass.wp;     // 总质量(kg)
  return {p:p, d:d, mats:mats, rows:rows, catTotal:catTotal, catMass:catMass,
          grand:grand, grandMass:grandMass,
          totalBatches:totalBatches, totalVolume:totalVolume};
}

/* ---------- 结果渲染 ---------- */
var lastResult = null;

function doCalc(){
  syncRecipesFromDOM();

    $("resultArea").innerHTML = '<div class="results-empty" style="color:var(--red)">输入存在错误，请修正标红项后重新计算。</div>';

  }
  var res = computeAll();

  renderResult(res);
}

/* ---------- 计算过程明细 ---------- */
function fillDetail(idx, box){
  var p = currentParams();

    {label:"缓凝剂", base:p.retBase, dens:p.retDens, ratio:Number(r.ret)},

  var idx = lastResult.rows.indexOf(row);

}
function num(x){ return String(x); }
function pad(n){ return (n<10?"0":"")+n; }

function requireResult(){

function copyResult(){
  if(!requireResult()) return;
  var rep = buildReportLines(lastResult);
  var text = rep.text;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ showToast("计算结果已复制"); },
      function(){ fallbackCopy(text); });

}
function fallbackCopy(text){
  var ta = document.createElement("textarea");

  try{ document.execCommand("copy"); showToast("计算结果已复制"); }

  document.body.removeChild(ta);

             q("单盘方量(m³)"),
             q("缓凝剂单盘(kg)"),q("缓凝剂单盘(L)"),q("减水剂单盘(kg)"),q("减水剂单盘(L)"),q("防水剂单盘(kg)"),q("防水剂单盘(L)"),
             q("单盘合计(kg)"),q("单盘合计(L)"),q("按盘数总量(kg)"),q("按盘数总量(L)")]);
  res.rows.forEach(function(row){
    rows.push([q(row.name||""), q(row.batches),
      q(row0ratio(row,"ret")), q(row0ratio(row,"red")), q(row0ratio(row,"wp")),
      q(fmt(row.vol,3)),
      q(fmt(row.mass.ret,d)), q(fmt(row.per.ret,d)), q(fmt(row.mass.red,d)), q(fmt(row.per.red,d)), q(fmt(row.mass.wp,d)), q(fmt(row.per.wp,d)),
      q(fmt(row.massSum,d)), q(fmt(row.perSum,d)), q(fmt(row.recipeMassTotal,d)), q(fmt(row.recipeTotal,d))]);
  });
  rows.push([]);
  rows.push([q("分类合计")]);
  rows.push([q("混凝土总盘数(盘)"), q(res.totalBatches)]);
  rows.push([q("混凝土总方量(m³)"), q(fmt(res.totalVolume,3))]);
  rows.push([q("缓凝剂总用量(kg)"), q(fmt(res.catMass.ret,d)), q("缓凝剂总用量(L)"), q(fmt(res.catTotal.ret,d))]);
  rows.push([q("减水剂总用量(kg)"), q(fmt(res.catMass.red,d)), q("减水剂总用量(L)"), q(fmt(res.catTotal.red,d))]);
  rows.push([q("防水剂总用量(kg)"), q(fmt(res.catMass.wp,d)), q("防水剂总用量(L)"), q(fmt(res.catTotal.wp,d))]);
  rows.push([q("三种外加剂总用量(kg)"), q(fmt(res.grandMass,d)), q("三种外加剂总用量(L)"), q(fmt(res.grand,d))]);
  rows.push([]);
  rows.push([q("提示：现场投料前应核对外加剂产品密度、配合比通知单及试验室确认数据。")]);
  rows.push([q("免责声明：本工具仅用于用量换算，最终投料量应以经批准的混凝土配合比、试验室通知及外加剂产品技术资料为准。")]);

  var csv = rows.map(function(r){ return r.join(","); }).join("\r\n");
  var blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "混凝土外加剂用量计算_"+now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+"_"+pad(now.getHours())+pad(now.getMinutes())+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast("CSV 已导出");
}

/* ---------- 折叠参数区 ---------- */
function openParams(){
  $("paramHead").classList.add("open");
  $("paramBody").classList.add("open");
}
$("paramHead").onclick = function(){
  this.classList.toggle("open");
  $("paramBody").classList.toggle("open");
};

/* ---------- 小数位切换 ---------- */
function renderDecSeg(){
  document.querySelectorAll("#decSeg button").forEach(function(b){
    b.classList.toggle("active", +b.getAttribute("data-d")===state.decimals);
  });
}
$("decSeg").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  state.decimals = +b.getAttribute("data-d");
  renderDecSeg(); saveState();
  if(lastResult){ lastResult.d = state.decimals; var res = computeAll(); lastResult = res; renderResult(res); }
});

/* ---------- 主按钮 ---------- */
$("calcBtn").onclick = doCalc;
$("addBtn").onclick = function(){
  syncRecipesFromDOM();
  state.recipes.push({name:"配方"+(state.recipes.length+1), batches:1, ret:0, red:70, wp:70});
  renderRecipes(); saveState();
};
$("clearBtn").onclick = function(){
  if(confirm("确定清空全部配方？此操作不可撤销。")){
    state.recipes = [{name:"配方1", batches:1, ret:0, red:70, wp:70}];
    renderRecipes(); saveState();
    lastResult = null;
    $("resultArea").innerHTML = '<div class="results-empty">已清空配方，请重新输入后计算。</div>';
    showToast("已清空全部配方");
  }
};
$("resetBtn").onclick = function(){
  if(confirm("确定恢复默认参数？将重置基础参数与默认三组配方（175% / 185% / 195%）。")){
    if(confirm("请再次确认：这会覆盖当前所有参数与配方。")){
      applyParams(DEFAULT_PARAMS);
      state.recipes = defaultRecipes();
      state.decimals = 3;
      renderRecipes(); renderDecSeg(); saveState();
      lastResult = null;
      $("resultArea").innerHTML = '<div class="results-empty">已恢复默认参数，请点击「开始计算」。</div>';
      showToast("已恢复默认参数");
    }
  }
};
$("copyBtn").onclick = copyResult;
$("printBtn").onclick = printResult;
$("csvBtn").onclick = exportCSV;

// 参数输入变化即保存
PARAM_IDS.forEach(function(id){ $(id).addEventListener("change", saveState); });

/* ---------- 初始化 ---------- */
loadState();
renderRecipes();
renderDecSeg();
</script>
</body>
</html>
